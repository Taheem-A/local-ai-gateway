name: tests

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LM_API_TOKEN: test-token
      GATEWAY_API_KEY: test-gateway-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint Python
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q app benchmarks clients/python/taheem_ai scripts tests work
      - name: Run tests
        run: pytest -q
