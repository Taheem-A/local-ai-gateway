[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taheem-ai"
version = "0.5.0"
description = "Python client for Taheem's Local AI Gateway"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "pydantic>=2.13,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["taheem_ai*"]
