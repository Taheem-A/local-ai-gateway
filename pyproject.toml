[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "benchmarks/backups",
    "benchmarks/results",
    "work",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Benchmark scripts intentionally import sibling modules as top-level modules so
# both `python benchmarks/run_benchmarks.py` and pytest discovery work without
# turning the historical benchmark directory into an installable package.
"benchmarks/run_benchmarks.py" = ["I001"]
"benchmarks/test_benchmarks.py" = ["I001"]
# These two modules group the RAG facade by architectural role. Ruff/isort would
# split aliased facade imports into several separate blocks, which makes the API
# entry point harder to scan without improving correctness.
"app/main.py" = ["I001"]
"app/rag/service.py" = ["I001"]
